-- ─────────────────────────────────────────────────────────────────────────────
-- metals.conf  —  Conky widget: Gold spot price
-- Place at:  ~/.config/conky/metals.conf
-- Launch:    conky -c ~/.config/conky/metals.conf
-- ─────────────────────────────────────────────────────────────────────────────

conky.config = {
    alignment = 'top_left',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrains Mono:size=12',
    gap_x = 60,
    gap_y = 60,
    minimum_height = 5,
    minimum_width = 5,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    color1              = '4ecb71',   -- up
    color2              = 'e05a5a',   -- dow
}


conky.text = [[
${color0}GOLD · EUR${color}
${hr 1}
${execp python3 ~/.config/conky/scripts/gold_format.py}
${hr 1}
${color3}Updated ${time %H:%M:%S} · 60s interval${color}
]]
